# Tests, builds and publishes the site to GitHub Pages.
#
# It also runs on a timer so the central-bank headlines stay fresh: they are
# copied at build time, because most of those feeds do not allow requests
# from a visitor's browser.
#
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *' # every six hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Copy the latest headlines
        # If a bank cannot be reached the headlines already in the repository are kept.
        run: npm run news:fetch
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
