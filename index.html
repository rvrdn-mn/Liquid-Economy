<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Liquid Markets Desk</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Liquid Markets Desk</h1>
      <span class="tag">Phase 0 · data check</span>
    </header>
    <main>
      <section>
        <h2>Check one of your exports</h2>
        <p class="hint">
          Choose an MT4 or MT5 price export. It is read in this browser tab only and is not uploaded or stored.
        </p>
        <div class="controls">
          <input id="file" type="file" accept=".csv,.txt" multiple />
          <label>
            Server time is UTC
            <select id="offset"></select>
          </label>
        </div>
        <div id="import-result" class="result" aria-live="polite"></div>
      </section>
      <section>
        <h2>Sample files</h2>
        <p id="sample-note" class="hint"></p>
        <div id="samples" class="result"></div>
      </section>
    </main>
    <footer>For market context only. Not financial advice.</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
